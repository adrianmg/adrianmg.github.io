<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if page.url == "/" %}
        <title>{{ page.browser_title | default: site.title | escape }}</title>
        {% seo title=false %}
    {% else %}
        {% seo %}
    {% endif %}

    {% unless page.date %}
        <meta property="og:type" content="website" />
    {% endunless %}

    <meta property="og:image:alt" content="{{ page.title | default: site.title | escape }}" />

    <link rel="preload" as="style" href="{{ "/assets/css/style.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" as="style" href='https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap'>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
    <link href="{{ '/assets/images/favicon.png' | relative_url }}" rel="icon" type="image/png" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" |
        relative_url }}">
    {% if jekyll.environment == 'production' %}
        {% include analytics.html %}
    {% endif %}
</head>
