name: Site

on:
  pull_request:
    paths:
      - "_posts/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "astro.config.mjs"
      - "netlify.toml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
