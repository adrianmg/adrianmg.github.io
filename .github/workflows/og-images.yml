name: Open Graph images

on:
  pull_request:
    paths:
      - "_posts/**"
      - "assets/og/posts/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-og-images.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run og:check
